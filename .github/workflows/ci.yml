name: R3X Workspace CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r3x-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    name: Format, Clippy, Test & Deny (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Install Linux Slint & DBus system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libglu1-mesa-dev pkg-config

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check license, ban, and source policies
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: check licenses bans sources

      - name: Check workspace compilation
        run: cargo check --workspace --locked

      - name: Run Clippy lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Build release binary
        run: cargo build --release --locked
