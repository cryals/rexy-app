name: R3X Release Packaging

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  verify:
    name: Release Gate Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: check licenses bans sources
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libglu1-mesa-dev pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked

  package-windows:
    needs: verify
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
      - shell: pwsh
        run: .\packaging\windows\package-portable.ps1 -DistDir dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/*.zip
            dist/*.cdx.json
            dist/SHA256SUMS.txt

  package-linux:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libglu1-mesa-dev pkg-config dpkg-dev
          chmod +x packaging/linux/build-deb.sh packaging/linux/build-appimage.sh
          ./packaging/linux/build-deb.sh
          ./packaging/linux/build-appimage.sh
          (cd dist && sha256sum *.deb *.tar.gz *.AppImage 2>/dev/null || true) > dist/SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/*

  publish-draft:
    needs: [package-windows, package-linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true
          prerelease: true
          generate_release_notes: true
          files: artifacts/**/*
