name: R3X Release Packaging

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0-rc.1)"
        required: true
        default: "v0.1.0-rc.1"

permissions:
  contents: write

jobs:
  verify:
    name: Release Gate Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check licenses bans sources
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libglu1-mesa-dev pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked

  package-windows:
    needs: verify
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@v2
      - name: Set up Python 3.12 (for CycloneDX SBOM)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - shell: pwsh
        run: .\packaging\windows\package-portable.ps1 -DistDir dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/*.zip
            dist/*.cdx.json
            dist/SHA256SUMS.txt

  package-linux:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libglu1-mesa-dev pkg-config dpkg-dev
          chmod +x packaging/linux/build-deb.sh packaging/linux/build-appimage.sh
          ./packaging/linux/build-deb.sh
          ./packaging/linux/build-appimage.sh
          (cd dist && sha256sum *.deb *.tar.gz *.AppImage 2>/dev/null || true) > dist/SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/*.AppImage
            dist/SHA256SUMS-linux.txt
          if-no-files-found: warn

  package-android:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android platform-36 & NDK 27
        run: |
          ANDROID_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || ls -1 "$ANDROID_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_ROOT" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$ANDROID_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
      - name: Set up Gradle 8.13 (AGP 8.9.1 compatible)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build Android ARM64 library and APK
        run: |
          export NDK_BIN="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android29-clang"
          export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android29-clang"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          cargo build --lib --target aarch64-linux-android --release --locked
          mkdir -p platform/android/app/src/main/jniLibs/arm64-v8a dist
          cp target/aarch64-linux-android/release/libr3x_app_lib.so platform/android/app/src/main/jniLibs/arm64-v8a/
          (cd platform/android && gradle assembleDebug)
          cp platform/android/app/build/outputs/apk/debug/*.apk dist/r3x-0.1.0-android-arm64-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/r3x-0.1.0-android-arm64-debug.apk
          if-no-files-found: warn

  publish-release:
    needs: [package-windows, package-linux, package-android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: false
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          generate_release_notes: true
          files: artifacts/*
