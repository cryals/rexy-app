name: R3X Criterion Benchmarks

on:
  push:
    branches: [main]
    paths:
      - "crates/r3x-diagnostics/**"
      - "crates/r3x-profiles/**"
      - "crates/r3x-cores/**"
      - ".github/workflows/benchmarks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: Run Criterion Benchmarks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0

      - uses: Swatinem/rust-cache@v2

      - name: Run r3x-diagnostics benchmarks
        run: cargo bench -p r3x-diagnostics --bench r3x_benchmarks --locked -- --sample-size 10 --measurement-time 1
